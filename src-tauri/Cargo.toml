[package]
name = "hachibongo"
version = "0.2.2"
edition = "2021"
description = "키보드·마우스 입력을 따라 치는 하치와레 오버레이"

[features]
# Tauri 는 릴리스 여부를 --release 가 아니라 이 feature 로 가른다. 꺼져 있으면
# 프론트를 exe 에 박지 않고 devUrl 을 찾는다.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 같이 하기 방 코드: 난수와 클립보드(카톡으로 코드를 주고받는다)
getrandom = "0.3"
arboard = { version = "3", default-features = false }
# 자체 업데이트. 받는 곳·열쇠는 src/update.rs. TLS 는 운영체제 것을 쓴다 - 기본(rustls)은 ring 을 C 로 굽느라
# 이 PC 에서 맥 타입 검사가 안 되고 실행 파일도 커진다. 설치 파일을 zip 에 싸 보내지 않으니 zip 도 뺀다.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
] }

[profile.release]
strip = true

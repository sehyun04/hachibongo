# 맥판은 이 PC(Windows)에서 구울 수 없어서 GitHub 의 맥에서 굽는다. 결과물은 이 실행의 Artifacts 에 hachibongo-mac.zip 으로 남는다.
# 서명은 임시(ad-hoc)라 처음 열 때 한 번 막힌다 - README 의 '맥에서' 절.
name: mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mac.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 단위 검증
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # 인텔·애플 실리콘 맥 둘 다 열리게 한 파일로 굽는다
      - name: 굽기
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: 묶기
        run: ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/hachibongo.app hachibongo-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hachibongo-mac
          path: hachibongo-mac.zip
          retention-days: 30
